listen_addresses = ''
port = 5432
unix_socket_directories = '{{ .DatabaseDir }}'

shared_preload_libraries = 'vchord.so'
search_path = '"$user", public'

log_destination = 'syslog'
syslog_ident = 'immich.postgres'

shared_buffers = 128MB
work_mem = 8MB
maintenance_work_mem = 64MB
max_wal_size = 1GB
wal_compression = on
random_page_cost = 1.2
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_scale_factor = 0.05
autovacuum_vacuum_cost_limit = 1000

# The llvm bitcode the debian postgres package ships for the JIT is 23MB of
# dead weight in the snap, so it is dropped in postgresql/build.sh and the JIT
# has to be switched off to match.
jit = off

datestyle = 'iso, mdy'
timezone = 'UTC'
lc_messages = 'C'
lc_monetary = 'C'
lc_numeric = 'C'
lc_time = 'C'
default_text_search_config = 'pg_catalog.english'
dynamic_shared_memory_type = posix
